server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API is a separate service; the web container only forwards /api to it.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 4m;
    }

    # Hashed assets never change: cache them for a year. The page itself is never cached so a deploy is seen at once.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Scripts and styles only from the same origin; the document downloads use blob: links and the archive links go to the object store (a navigation, not a fetch). The one outside script is the checkout of Culqi (ADR-073):
        # its script from js.culqi.com and what it loads or opens from culqi.com. Nothing else of Culqi is allowed; if its checkout needs another address, the browser console says which.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; style-src-attr 'unsafe-inline'; script-src 'self' https://js.culqi.com; connect-src 'self' https://*.culqi.com; frame-src https://*.culqi.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
