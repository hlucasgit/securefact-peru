# Local development stack. Secrets come from .env (see .env.example); nothing sensitive is hard-coded here.
name: securefact

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SF_APP_DB_USER: ${SF_APP_DB_USER:?set in .env}
      SF_APP_DB_PASSWORD: ${SF_APP_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${SF_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${SF_REDIS_PORT:-56379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in .env}
    ports:
      - "127.0.0.1:${SF_RABBITMQ_PORT:-55672}:5672"
      - "127.0.0.1:${SF_RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # S3-compatible object store for local development (ADR-005). Application code uses only the S3 API.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
    ports:
      - "127.0.0.1:${SF_S3_PORT:-58000}:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
      AWS_DEFAULT_REGION: us-east-1
      SF_STORAGE_BUCKET: ${SF_STORAGE_BUCKET:-securefact-documents}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$${SF_STORAGE_BUCKET}" 2>/dev/null ||
        aws --endpoint-url http://s3:8333 s3 mb "s3://$${SF_STORAGE_BUCKET}";
        aws --endpoint-url http://s3:8333 s3api put-bucket-versioning --bucket "$${SF_STORAGE_BUCKET}" --versioning-configuration Status=Enabled
    restart: "no"

  # One-shot schema migration using the owner role. The runtime role (securefact_app) never has DDL rights.
  migrate:
    build:
      context: .
      dockerfile: src/SecureFact.Api/Dockerfile
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Migrations: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__App: Host=postgres;Database=${POSTGRES_DB};Username=${SF_APP_DB_USER};Password=${SF_APP_DB_PASSWORD}
      Identity__SigningKey: ${SF_JWT_SIGNING_KEY:?set in .env}
      Security__LocalDevKek: ${SF_LOCAL_DEV_KEK:?set in .env}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/SecureFact.Api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${SF_ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      SF__Environment: ${SF_ENVIRONMENT:-Local}
      ConnectionStrings__App: Host=postgres;Database=${POSTGRES_DB};Username=${SF_APP_DB_USER};Password=${SF_APP_DB_PASSWORD}
      Identity__SigningKey: ${SF_JWT_SIGNING_KEY:?set in .env}
      Security__LocalDevKek: ${SF_LOCAL_DEV_KEK:?set in .env}
      # Signed XML and CDR are archived in the object store (ADR-005, ADR-036); the credentials are the ones of the s3 container, from .env.
      Storage__S3__ServiceUrl: http://s3:8333
      Storage__S3__Bucket: ${SF_STORAGE_BUCKET:-securefact-documents}
      Storage__S3__AccessKey: ${S3_ACCESS_KEY:?set in .env}
      Storage__S3__SecretKey: ${S3_SECRET_KEY:?set in .env}
      # SUNAT is never reached implicitly: leave empty to only prepare and sign, set Sandbox for the in-process simulator (ADR-039), or Beta / Production explicitly. Same value as the workers.
      Sunat__Environment: ${SF_SUNAT_ENVIRONMENT:-}
      # Domains of the resellers (ADR-051): the simulator of the DNS answers every check; a real deployment sets System and the edge (deploy/edge).
      Domains__Dns__Provider: ${SF_DOMAINS_DNS_PROVIDER:-Sandbox}
      Domains__EdgeHost: ${SF_EDGE_HOST:-}
      Domains__EdgeSecret: ${SF_EDGE_SECRET:-}
      # Outgoing e-mail (ADR-052): None sends nothing; Smtp sends through your server (SF_SMTP_*); Sandbox writes each e-mail as an .eml file under SF_MAIL_DIR (development and tests only).
      Email__Provider: ${SF_EMAIL_PROVIDER:-None}
      Email__From: ${SF_EMAIL_FROM:-}
      Email__Smtp__Host: ${SF_SMTP_HOST:-}
      Email__Smtp__Port: ${SF_SMTP_PORT:-587}
      Email__Smtp__Security: ${SF_SMTP_SECURITY:-StartTls}
      Email__Smtp__User: ${SF_SMTP_USER:-}
      Email__Smtp__Password: ${SF_SMTP_PASSWORD:-}
      Email__Sandbox__Directory: /var/lib/securefact/mail
      # The address of the web interface, base of the links in the e-mails (a reseller with a verified domain gets its own).
      Web__PublicUrl: ${SF_PUBLIC_URL:-http://localhost:5173}
      # Sign-ins allowed per minute and address (the end-to-end tests raise it).
      RateLimiting__AuthPermitPerMinute: ${SF_AUTH_RATE_LIMIT:-20}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${SF_OTLP_ENDPOINT:-}
    volumes:
      - ${SF_MAIL_DIR:-./.data/mail}:/var/lib/securefact/mail
    ports:
      - "127.0.0.1:${SF_API_PORT:-5180}:8080"

  # The web interface (React) behind nginx, which forwards /api to the API. http://localhost:${SF_WEB_PORT:-5173}
  web:
    build:
      context: web
    depends_on:
      - api
    ports:
      - "127.0.0.1:${SF_WEB_PORT:-5173}:8080"

  workers:
    build:
      context: .
      dockerfile: src/SecureFact.Workers/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Development
      SF__Environment: ${SF_ENVIRONMENT:-Local}
      Domains__Dns__Provider: ${SF_DOMAINS_DNS_PROVIDER:-Sandbox}
      Domains__EdgeHost: ${SF_EDGE_HOST:-}
      ConnectionStrings__App: Host=postgres;Database=${POSTGRES_DB};Username=${SF_APP_DB_USER};Password=${SF_APP_DB_PASSWORD}
      Security__LocalDevKek: ${SF_LOCAL_DEV_KEK:?set in .env}
      # Signed XML and CDR are archived in the object store (ADR-005, ADR-036); the credentials are the ones of the s3 container, from .env.
      Storage__S3__ServiceUrl: http://s3:8333
      Storage__S3__Bucket: ${SF_STORAGE_BUCKET:-securefact-documents}
      Storage__S3__AccessKey: ${S3_ACCESS_KEY:?set in .env}
      Storage__S3__SecretKey: ${S3_SECRET_KEY:?set in .env}
      # Events also go to the message bus (ADR-035) when RabbitMq__Host is set; the credentials are the ones of the broker container, from .env.
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:?set in .env}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:?set in .env}
      # SUNAT is never reached implicitly: leave empty to only prepare summaries, or set Beta / Production explicitly.
      Sunat__Environment: ${SF_SUNAT_ENVIRONMENT:-}
      Cpe__WorkerIntervalSeconds: ${SF_CPE_WORKER_INTERVAL:-15}
      # The queued e-mails (ADR-054) leave from here, with the same channel as the API. The Sandbox files go to the same folder.
      Email__Provider: ${SF_EMAIL_PROVIDER:-None}
      Email__From: ${SF_EMAIL_FROM:-}
      Email__Smtp__Host: ${SF_SMTP_HOST:-}
      Email__Smtp__Port: ${SF_SMTP_PORT:-587}
      Email__Smtp__Security: ${SF_SMTP_SECURITY:-StartTls}
      Email__Smtp__User: ${SF_SMTP_USER:-}
      Email__Smtp__Password: ${SF_SMTP_PASSWORD:-}
      Email__Sandbox__Directory: /var/lib/securefact/mail
      Web__PublicUrl: ${SF_PUBLIC_URL:-http://localhost:5173}
    volumes:
      - ${SF_MAIL_DIR:-./.data/mail}:/var/lib/securefact/mail

  # Optional local observability stack: docker compose --profile observability up -d
  # Grafana http://localhost:3000 (Loki, Tempo, Prometheus); set SF_OTLP_ENDPOINT=http://otel:4317 for the API.
  otel:
    profiles: ["observability"]
    image: grafana/otel-lgtm:latest
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  s3data:
