name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Docker Hub through a mirror (the shared runners exhaust its anonymous pull limit)
        run: bash .github/scripts/docker-mirror.sh
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore SecureFact.slnx --locked-mode
      - name: Build
        run: dotnet build SecureFact.slnx -c Release --no-restore
      - name: Tests with coverage
        run: dotnet test SecureFact.slnx -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory coverage-results
      - name: Coverage report and floor
        env:
          # The floors are a ratchet: raise them when the coverage rises. See docs/testing/README.md.
          MIN_LINE_COVERAGE: "95"
          MIN_BRANCH_COVERAGE: "84"
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator -reports:"coverage-results/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;JsonSummary;Cobertura;HtmlInline" -assemblyfilters:"+SecureFact.*"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/check_coverage.py coverage/Summary.json "$MIN_LINE_COVERAGE" "$MIN_BRANCH_COVERAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      - name: Vulnerable packages
        run: |
          dotnet list SecureFact.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "Vulnerable dependencies found"; exit 1; fi
      - name: SBOM
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool
          sbom-tool generate -b ./src -bc . -pn SecureFact -pv 0.0.0-${{ github.sha }} -ps SecureFact -nsb https://securefact.invalid -V Error || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: _manifest
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Vulnerable packages (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  # End-to-end tests of the web interface against the real API, PostgreSQL and S3 store, with the SUNAT simulator (ADR-039, ADR-040).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Docker Hub through a mirror (the shared runners exhaust its anonymous pull limit)
        run: bash .github/scripts/docker-mirror.sh
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Environment (local-only secrets, generated for this run)
        run: |
          cp .env.example .env
          sed -i "s|^SF_JWT_SIGNING_KEY=.*|SF_JWT_SIGNING_KEY=$(openssl rand -base64 48)|; s|^SF_LOCAL_DEV_KEK=.*|SF_LOCAL_DEV_KEK=$(openssl rand -base64 32)|" .env
      - name: Publish API and workers
        run: |
          dotnet publish src/SecureFact.Api -c Release -o run/api
          dotnet publish src/SecureFact.Workers -c Release -o run/workers
      - name: Start the stack
        run: bash .github/scripts/e2e-stack.sh
      - name: Install the web dependencies and the browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            logs
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Third-party actions are pinned to a commit: a tag can be moved (aquasecurity/trivy-action tags were rewritten in the March 2026 supply chain attack).
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/SecureFact.Api/Dockerfile -t securefact-api:ci .
      - name: Build workers image
        run: docker build -f src/SecureFact.Workers/Dockerfile -t securefact-workers:ci .
      - name: Build web image
        run: docker build -t securefact-web:ci web
      - name: Scan images (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: securefact-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan workers image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: securefact-workers:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan web image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: securefact-web:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
